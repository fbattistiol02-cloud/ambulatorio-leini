<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780"><rect width="390" height="780" fill="#f0f5fa"/><path d="M24 90H366" stroke="#164fa4" opacity=".2"/><text x="24" y="55" fill="#164fa4" font-family="Arial" font-weight="bold" font-size="17">Ambulatorio Veterinario Leinì</text><text x="24" y="145" fill="#164fa4" font-family="Arial" font-size="12" letter-spacing="2">PRECISIONE · ESPLORAZIONE VISIVA</text><text x="24" y="210" fill="#164fa4" font-family="Arial" font-weight="700" font-size="44">Medicina e</text><text x="24" y="262" fill="#164fa4" font-family="Arial" font-weight="700" font-size="44">chirurgia</text><text x="24" y="314" fill="#164fa4" font-family="Arial" font-weight="700" font-size="44">veterinaria,</text><text x="24" y="366" fill="#164fa4" font-family="Arial" font-weight="700" font-size="44">a Leinì.</text><text x="24" y="455" font-family="Arial" font-size="14" fill="#35536a">Con il Dott. Davide Boasso</text><text x="24" y="480" font-family="Arial" font-size="14" fill="#35536a">e la Dott.ssa Erika Valieri.</text><rect x="24" y="515" width="245" height="54" rx="4" fill="#164fa4"/><text x="47" y="549" fill="white" font-family="Arial" font-size="17">Chiama per una visita →</text><text x="24" y="610" fill="#35536a" font-family="Arial" font-size="14">Via San Francesco al Campo 24, Leinì</text><text x="24" y="644" fill="#35536a" font-family="Arial" font-size="14">Cani, gatti e animali non convenzionali.</text></svg>